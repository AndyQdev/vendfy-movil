plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'shop.vendfy'
version = '0.1.0'

android {
  namespace "expo.modules.vendfyoido"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // Los mismos modelos del panel (espectrograma, embedding y «Oye Vendfy»).
  implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'
}
